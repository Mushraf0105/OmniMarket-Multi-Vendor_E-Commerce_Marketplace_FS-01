version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: omnimarket-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: multivendor_ecommerce
    volumes:
      - mongo_data:/data/db

  # Redis Service (Cart & Session Cache)
  redis:
    image: redis:7.2-alpine
    container_name: omnimarket-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Elasticsearch Service (Product Search & Aggregations)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: omnimarket-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  mongo_data:
  redis_data:
  es_data:

